# Render Blueprint for the Veritas Daily API.
# Free plan sleeps when idle, so in-process cron is off and GitHub Actions
# (.github/workflows/scheduled-jobs.yml) triggers jobs via /api/internal/jobs.
services:
  - type: web
    name: veritas-daily-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_CRON
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: FREE_DAILY_VERIFICATIONS
        value: "5"
      - key: JWT_EXPIRE
        value: 7d
      - key: FROM_NAME
        value: Veritas Daily
      # Generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      # Set these in the Render dashboard (never committed)
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false